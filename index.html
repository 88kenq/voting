<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>班級投票板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 版面：上方置中標題 → 設定列 → 候選人卡片（含計票）→ 結果區（左得票清單／右圓餅圖） */
:root{
  /* 固定深色配色：墨綠黑底、深灰面板、暗金與磚紅按鈕 */
  --bg:#1b2420;
  --paper:#181a1b;
  --ink:#cdc8c2;
  --muted:#a59d91;
  --line:#3a3f41;
  --accent:#a22a18;      /* 磚紅按鈕 */
  --accent-ink:#e8e6e3;
  --accent-text:#e2654f; /* 深底上的紅字 */
  --sun:#785806;         /* 暗金按鈕 */
  --sun-ink:#ece6d8;
  --soft:#1f2c26;
  --badge:#17222e;
  --badge-ink:#e8e6e3;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --radius:0.875rem;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
/* 整頁以 rem 為單位，基準字級隨螢幕寬度縮放：手機約 15px、1080p 約 17px、2K 約 21px、4K 約 29px */
html{font-size:clamp(15px,0.6vw + 6px,32px);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;min-height:100%;line-height:1.55;padding-inline:1rem;padding-block:1.25rem 3rem}
.wrap{max-width:73.75rem;margin:0 auto;display:flex;flex-direction:column;gap:1.25rem}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:0.1875rem solid var(--sun);outline-offset:0.125rem}

/* 標題 */
.titlebar{text-align:center;display:flex;flex-direction:column;align-items:center;gap:0.25rem}
.eyebrow{font-size:0.8125rem;letter-spacing:.2em;color:var(--muted)}
#voteTitle{font-family:var(--display);font-size:clamp(1.875rem,5vw,3.25rem);text-align:center;border:none;background:transparent;width:100%;max-width:56.25rem;padding:0.375rem 0.625rem;border-bottom:0.1875rem dashed var(--line);border-radius:0}
#voteTitle:hover,#voteTitle:focus{border-bottom-color:var(--accent-text);outline:none}

/* 卡片區塊 */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:1.25rem}
.panel h2{font-family:var(--display);font-weight:400;font-size:1.375rem;margin:0 0 0.875rem;display:flex;align-items:center;gap:0.625rem;flex-wrap:wrap}
.tag{font-family:var(--body);font-size:0.75rem;background:var(--soft);color:var(--muted);padding:0.125rem 0.625rem;border-radius:999px}

/* 設定列 */
.settings{display:flex;flex-wrap:wrap;gap:1.125rem 1.75rem;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:0.375rem}
.field label{font-size:0.875rem;color:var(--muted);font-weight:500}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:0.625rem;overflow:hidden;background:var(--bg)}
.stepper button{width:2.75rem;height:2.75rem;border:none;background:transparent;font-size:1.375rem}
.stepper button:hover{background:var(--soft)}
.stepper input{width:3.5rem;height:2.75rem;text-align:center;border:none;background:transparent;font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat{font-size:0.875rem;color:var(--muted)}
.stat b{font-size:1.375rem;color:var(--ink);font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:0.625rem;margin-left:auto}
.btn{border:1px solid var(--line);background:var(--paper);padding:0.625rem 1.125rem;border-radius:0.625rem;font-weight:500}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--sun-ink);font-weight:700}

/* 候選人卡片 */
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(15.625rem,1fr));gap:0.875rem}
.cand{border:1px solid var(--line);border-radius:0.75rem;padding:0.875rem;display:flex;flex-direction:column;gap:0.625rem;background:var(--bg);position:relative}
.cand .no{position:absolute;top:-0.625rem;left:0.75rem;background:var(--badge);color:var(--badge-ink);font-family:var(--display);font-size:0.875rem;padding:1px 0.625rem;border-radius:999px}
.cand .row{display:flex;flex-direction:column;gap:0.1875rem}
.cand label{font-size:0.75rem;color:var(--muted)}
.cand input{border:1px solid var(--line);border-radius:0.5rem;padding:0.5rem 0.625rem;background:var(--paper);min-width:0}
.cand input.name{font-size:1.25rem;font-weight:700}
.tally{display:flex;align-items:center;justify-content:space-between;gap:0.5rem;border-top:1px dashed var(--line);padding-top:0.625rem}
.tally .count{font-family:var(--display);font-size:1.875rem;font-variant-numeric:tabular-nums;min-width:2.2em;text-align:center}
.tally .count small{font-family:var(--body);font-size:0.8125rem;color:var(--muted);margin-left:0.125rem}
.tally button{width:2.75rem;height:2.75rem;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:1.375rem;line-height:1}
.tally button.plus{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.swatch{display:inline-block;width:0.75rem;height:0.75rem;border-radius:0.1875rem;flex:none}

/* 結果 */
.results{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,26.25rem);gap:1.75rem;align-items:center}
@media (max-width:820px){.results{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:0.75rem;min-width:0}
.item{display:grid;grid-template-columns:1.75rem minmax(0,1fr) auto;gap:0.25rem 0.75rem;align-items:center}
.item .rank{font-family:var(--display);font-size:1.25rem;color:var(--muted);text-align:center}
.item.lead .rank{color:var(--accent-text)}
.item .who{display:flex;align-items:baseline;gap:0.5rem;flex-wrap:wrap;min-width:0}
.item .who strong{font-size:1.1875rem}
.item .who span{font-size:0.8125rem;color:var(--muted)}
.item .num{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.25rem;text-align:right;white-space:nowrap}
.item .num small{font-weight:400;font-size:0.8125rem;color:var(--muted);margin-left:0.375rem}
.bar{grid-column:2 / 4;height:0.75rem;background:var(--soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .4s ease}
.pie-box{display:flex;flex-direction:column;align-items:center;gap:0.5rem}
#pie{width:100%;max-width:23.75rem;aspect-ratio:1;height:auto}
.empty{color:var(--muted);text-align:center;padding:1.875rem 0}

/* 投票模式覆蓋層 */
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 1.25rem) 1rem calc(env(safe-area-inset-bottom,0px) + 1.5rem)}
.ballot{max-width:62.5rem;margin:0 auto;display:flex;flex-direction:column;gap:1.125rem}
.ballot-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.75rem}
.ballot-head h3{font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,4vw,2.25rem);margin:0}
.ballot-hint{font-size:1.125rem}
.ballot-hint b{color:var(--accent-text);font-size:1.625rem;font-variant-numeric:tabular-nums}
.ballot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(12.5rem,1fr));gap:0.875rem}
.pick{border:0.1875rem solid var(--line);background:var(--paper);border-radius:1rem;padding:1.5rem 0.875rem;text-align:center;display:flex;flex-direction:column;gap:0.375rem;align-items:center;position:relative;transition:transform .12s}
.pick:hover{transform:translateY(-0.125rem)}
.pick .pn{font-family:var(--display);font-size:clamp(1.625rem,4vw,2.375rem)}
.pick .pr{font-size:0.875rem;color:var(--muted)}
.pick .stamp{position:absolute;top:0.625rem;right:0.75rem;width:2.875rem;height:2.875rem;border-radius:50%;border:0.1875rem solid var(--accent-text);color:var(--accent-text);font-family:var(--display);font-size:1.25rem;display:none;align-items:center;justify-content:center;transform:rotate(-12deg)}
.pick.on{border-color:var(--accent-text)}
.pick.on .stamp{display:flex}
.ballot-foot{display:flex;justify-content:center;gap:0.75rem;flex-wrap:wrap}
.ballot-foot .btn{font-size:1.25rem;padding:0.875rem 1.875rem}
.toast{text-align:center;color:var(--muted);min-height:1.6em}

/* 公布當選 */
#winner{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 45%,#2a1f4d 0%,#0c0a1a 70%);color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
#fw{position:absolute;inset:0;width:100%;height:100%}
.win-inner{position:relative;text-align:center;padding:1rem;display:flex;flex-direction:column;align-items:center;gap:0.625rem}
.win-label{font-family:var(--display);font-size:max(1.25rem,min(3.5vw,6vh));color:#f6c445;letter-spacing:.15em}
.win-name{font-family:var(--display);font-size:max(3.5rem,min(17vw,34vh));line-height:1.1;text-shadow:0 0 2.5rem rgba(255,200,80,.55);animation:pop 1s cubic-bezier(.2,1.6,.4,1) both;word-break:break-all}
.win-sub{font-size:max(1rem,min(2.4vw,4.2vh));color:#d9d4f0}
.win-close{font-size:max(0.875rem,1.6vh);color:#9c95c4;margin-top:1.125rem}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.win-name{animation:none}.bar i{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="titlebar">
    <div class="eyebrow">班級投票</div>
    <input id="voteTitle" type="text" value="六年十班 模範生選舉" aria-label="投票名稱" placeholder="請輸入投票名稱">
  </header>

  <section class="panel">
    <div class="settings">
      <div class="field">
        <label for="numCand">候選人數</label>
        <div class="stepper">
          <button type="button" data-step="numCand" data-d="-1" aria-label="減少候選人">−</button>
          <input id="numCand" type="number" min="1" max="12" value="4">
          <button type="button" data-step="numCand" data-d="1" aria-label="增加候選人">+</button>
        </div>
      </div>
      <div class="field">
        <label for="perVote">每人可投幾票</label>
        <div class="stepper">
          <button type="button" data-step="perVote" data-d="-1" aria-label="減少票數">−</button>
          <input id="perVote" type="number" min="1" max="12" value="1">
          <button type="button" data-step="perVote" data-d="1" aria-label="增加票數">+</button>
        </div>
      </div>
      <div class="stat">已投票人數<br><b id="voterCount">0</b> 人</div>
      <div class="stat">總票數<br><b id="totalVotes">0</b> 票</div>
      <div class="actions">
        <button class="btn" id="resetBtn" type="button">清除票數</button>
        <button class="btn sun" id="ballotBtn" type="button">開始投票</button>
        <button class="btn primary" id="announceBtn" type="button">公布當選人 🎆</button>
      </div>
    </div>
    <div class="toast" id="resetConfirm" hidden>
      確定要把所有票數歸零嗎？
      <button class="btn" id="resetYes" type="button">確定清除</button>
      <button class="btn" id="resetNo" type="button">取消</button>
    </div>
  </section>

  <section class="panel">
    <h2>候選人 <span class="tag" id="sampleTag">目前為範例名字與票數，可直接修改</span></h2>
    <div class="cands" id="cands"></div>
  </section>

  <section class="panel">
    <h2>開票結果</h2>
    <div class="results">
      <div class="list" id="list"></div>
      <div class="pie-box">
        <svg id="pie" viewBox="0 0 400 400" role="img" aria-label="各候選人得票圓形圖"></svg>
      </div>
    </div>
  </section>
</div>

<!-- 投票模式 -->
<div class="overlay" id="ballot" hidden>
  <div class="ballot">
    <div class="ballot-head">
      <h3 id="ballotTitle">第 1 位同學投票</h3>
      <div class="ballot-hint">已選 <b id="pickedN">0</b> / <span id="pickMax">1</span> 票</div>
    </div>
    <div class="ballot-grid" id="ballotGrid"></div>
    <div class="toast" id="ballotMsg"></div>
    <div class="ballot-foot">
      <button class="btn" id="ballotClear" type="button">重選</button>
      <button class="btn primary" id="ballotSubmit" type="button">投出這一票</button>
      <button class="btn" id="ballotExit" type="button">結束投票</button>
    </div>
  </div>
</div>

<!-- 公布當選 -->
<div id="winner" hidden>
  <canvas id="fw"></canvas>
  <div class="win-inner">
    <div class="win-label" id="winLabel">恭喜當選</div>
    <div class="win-name" id="winName"></div>
    <div class="win-sub" id="winSub"></div>
    <div class="win-close">點一下畫面關閉</div>
  </div>
</div>

<script>
const COLORS=["#e2513b","#2f7fd1","#f2b01e","#2ea36b","#8c5bd6","#e0679d","#18a7b5","#f07f2a","#6b8e23","#b5523b","#4f5fbf","#9a7b4f"];
const SAMPLE=[["王小明","陳老師"],["林美華","張家豪"],["李志強","吳佩珊"],["黃雅婷","劉建宏"]];
let cands=SAMPLE.map((s,i)=>({name:s[0],rec:s[1],votes:[12,9,6,3][i]}));
let voters=0;
const $=id=>document.getElementById(id);

function clamp(v,a,b){v=parseInt(v,10);if(isNaN(v))v=a;return Math.max(a,Math.min(b,v))}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function label(c,i){return c.name.trim()||`${i+1} 號候選人`}

function resize(n){
  while(cands.length<n)cands.push({name:"",rec:"",votes:0});
  cands.length=n;
}

function renderCands(){
  $("cands").innerHTML=cands.map((c,i)=>`
    <div class="cand">
      <span class="no">${i+1} 號</span>
      <div class="row"><label for="n${i}">候選人姓名</label>
        <input class="name" id="n${i}" data-i="${i}" data-k="name" value="${esc(c.name)}" placeholder="輸入姓名"></div>
      <div class="row"><label for="r${i}">推薦人</label>
        <input id="r${i}" data-i="${i}" data-k="rec" value="${esc(c.rec)}" placeholder="輸入推薦人姓名"></div>
      <div class="tally">
        <button type="button" data-i="${i}" data-v="-1" aria-label="減一票">−</button>
        <span class="count"><span id="c${i}">${c.votes}</span><small>票</small></span>
        <button type="button" class="plus" data-i="${i}" data-v="1" aria-label="加一票">+</button>
      </div>
    </div>`).join("");
}

function renderResults(){
  const total=cands.reduce((s,c)=>s+c.votes,0);
  $("totalVotes").textContent=total;
  $("voterCount").textContent=voters;
  cands.forEach((c,i)=>{const el=$("c"+i);if(el)el.textContent=c.votes});
  const order=cands.map((c,i)=>({...c,i})).sort((a,b)=>b.votes-a.votes);
  const max=order.length?order[0].votes:0;
  let rank=0,prev=null;
  $("list").innerHTML=order.map((c,k)=>{
    if(c.votes!==prev){rank=k+1;prev=c.votes}
    const pct=total?Math.round(c.votes/total*1000)/10:0;
    const lead=max>0&&c.votes===max;
    return `<div class="item${lead?" lead":""}">
      <div class="rank">${rank}</div>
      <div class="who"><span class="swatch" style="background:${COLORS[c.i%12]}"></span><strong>${esc(label(c,c.i))}</strong>${c.rec.trim()?`<span>推薦人：${esc(c.rec)}</span>`:""}</div>
      <div class="num">${c.votes} 票<small>${pct}%</small></div>
      <div class="bar"><i style="width:${max?c.votes/max*100:0}%;background:${COLORS[c.i%12]}"></i></div>
    </div>`}).join("");
  drawPie(total);
}

function drawPie(total){
  const svg=$("pie"),cx=200,cy=200,r=170;
  if(!total){svg.innerHTML=`<circle cx="200" cy="200" r="170" fill="var(--soft)"/><text x="200" y="206" text-anchor="middle" font-size="22" fill="var(--muted)" font-family="var(--body)">尚無票數</text>`;return}
  let a0=-Math.PI/2,out="";
  const live=cands.map((c,i)=>({...c,i})).filter(c=>c.votes>0);
  live.forEach(c=>{
    const frac=c.votes/total,a1=a0+frac*Math.PI*2,col=COLORS[c.i%12];
    if(live.length===1){out+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${col}"/>`}
    else{
      const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
      out+=`<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${frac>.5?1:0} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${col}" stroke="var(--paper)" stroke-width="3"/>`;
    }
    if(frac>=.07){
      const m=(a0+a1)/2,lx=cx+r*.62*Math.cos(m),ly=cy+r*.62*Math.sin(m);
      const nm=label(c,c.i);const short=nm.length>4?nm.slice(0,4)+"…":nm;
      out+=`<text x="${lx.toFixed(1)}" y="${(ly-4).toFixed(1)}" text-anchor="middle" font-size="19" font-weight="700" fill="#fff" font-family="var(--body)">${esc(short)}</text>
            <text x="${lx.toFixed(1)}" y="${(ly+18).toFixed(1)}" text-anchor="middle" font-size="16" fill="#fff" font-family="var(--body)">${Math.round(frac*100)}%</text>`;
    }
    a0=a1;
  });
  svg.innerHTML=out;
}

function hideSample(){$("sampleTag").hidden=true}

/* 設定步進 */
document.querySelectorAll("[data-step]").forEach(b=>b.addEventListener("click",()=>{
  const inp=$(b.dataset.step);inp.value=clamp(+inp.value+ +b.dataset.d,1,12);inp.dispatchEvent(new Event("change"));
}));
$("numCand").addEventListener("change",e=>{const n=clamp(e.target.value,1,12);e.target.value=n;resize(n);renderCands();renderResults()});
$("perVote").addEventListener("change",e=>{e.target.value=clamp(e.target.value,1,12)});

/* 候選人輸入與加減票 */
$("cands").addEventListener("input",e=>{const t=e.target;if(t.dataset.k){cands[t.dataset.i][t.dataset.k]=t.value;hideSample();renderResults()}});
$("cands").addEventListener("click",e=>{const b=e.target.closest("button[data-v]");if(!b)return;
  const c=cands[b.dataset.i];c.votes=Math.max(0,c.votes+ +b.dataset.v);renderResults()});

/* 清除票數 */
$("resetBtn").onclick=()=>{$("resetConfirm").hidden=false};
$("resetNo").onclick=()=>{$("resetConfirm").hidden=true};
$("resetYes").onclick=()=>{cands.forEach(c=>c.votes=0);voters=0;$("resetConfirm").hidden=true;hideSample();renderResults()};

/* 投票模式 */
let picked=new Set();
function perVote(){return Math.min(clamp($("perVote").value,1,12),cands.length)}
function renderBallot(){
  $("ballotTitle").textContent=`第 ${voters+1} 位同學投票`;
  $("pickMax").textContent=perVote();$("pickedN").textContent=picked.size;
  $("ballotGrid").innerHTML=cands.map((c,i)=>`
    <button type="button" class="pick${picked.has(i)?" on":""}" data-i="${i}" aria-pressed="${picked.has(i)}">
      <span class="stamp">投</span>
      <span class="swatch" style="background:${COLORS[i%12]};width:18px;height:18px;border-radius:50%"></span>
      <span class="pn">${esc(label(c,i))}</span>
      <span class="pr">${c.rec.trim()?"推薦人："+esc(c.rec):`${i+1} 號`}</span>
    </button>`).join("");
}
$("ballotBtn").onclick=()=>{picked.clear();$("ballotMsg").textContent="";$("ballot").hidden=false;renderBallot()};
$("ballotGrid").addEventListener("click",e=>{const b=e.target.closest(".pick");if(!b)return;const i=+b.dataset.i;
  if(picked.has(i))picked.delete(i);
  else if(picked.size<perVote())picked.add(i);
  else{$("ballotMsg").textContent=`每人最多投 ${perVote()} 票，請先取消一位再選。`;return}
  $("ballotMsg").textContent="";renderBallot()});
$("ballotClear").onclick=()=>{picked.clear();$("ballotMsg").textContent="";renderBallot()};
$("ballotSubmit").onclick=()=>{
  if(!picked.size){$("ballotMsg").textContent="還沒有選擇候選人喔！";return}
  picked.forEach(i=>cands[i].votes++);voters++;hideSample();
  picked.clear();renderBallot();renderResults();
  $("ballotMsg").textContent=`✔ 第 ${voters} 位同學已投票，請下一位同學。`;
};
$("ballotExit").onclick=()=>{$("ballot").hidden=true};

/* 公布當選＋煙火 */
let fwRAF=null;
$("announceBtn").onclick=()=>{
  const max=Math.max(...cands.map(c=>c.votes));
  if(max<=0){$("list").scrollIntoView({behavior:"smooth"});return}
  const wins=cands.map((c,i)=>({c,i})).filter(o=>o.c.votes===max);
  $("winLabel").textContent=wins.length>1?"同票！並列最高票":"恭喜當選";
  $("winName").textContent=wins.map(o=>label(o.c,o.i)).join("、");
  $("winName").style.fontSize=wins.length>1?"max(2.5rem,min(9vw,20vh))":"";
  $("winSub").textContent=`${$("voteTitle").value.trim()||"投票"}　得票 ${max} 票`;
  const w=$("winner");w.hidden=false;
  const n=$("winName");n.style.animation="none";void n.offsetWidth;n.style.animation="";
  try{const p=w.requestFullscreen&&w.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}catch(e){}
  fireworks(3000);
};
$("winner").onclick=()=>{
  $("winner").hidden=true;cancelAnimationFrame(fwRAF);
  try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}
};

function fireworks(duration){
  const cv=$("fw"),ctx=cv.getContext("2d");
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const fit=()=>{cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};
  fit();
  window.onresize=fit;
  const W=()=>innerWidth,H=()=>innerHeight;
  const k=Math.max(1,Math.min(innerWidth,innerHeight*1.6)/1100);
  const hues=["#ffd34d","#ff5e57","#5ee0ff","#9dff6b","#ff8ad8","#ffffff","#b18cff"];
  let rockets=[],sparks=[];const start=performance.now();let lastLaunch=0;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function launch(){
    rockets.push({x:W()*(.15+Math.random()*.7),y:H(),vy:-(H()*.012+Math.random()*4),ty:H()*(.15+Math.random()*.35),col:hues[Math.random()*hues.length|0]});
  }
  function burst(x,y,col){
    const n=reduce?40:Math.round(90*Math.min(k,1.6));
    for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,s=(1.5+Math.random()*5)*k;
      sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col:Math.random()<.2?"#fff":col})}
  }
  // 開場先同時爆幾朵
  for(let k=0;k<3;k++)burst(W()*(.2+.3*k),H()*(.25+Math.random()*.15),hues[k]);
  function tick(t){
    const el=t-start;
    ctx.globalCompositeOperation="source-over";
    ctx.fillStyle="rgba(12,10,26,0.22)";ctx.fillRect(0,0,W(),H());
    ctx.globalCompositeOperation="lighter";
    if(el<duration&&t-lastLaunch>(reduce?500:220)){launch();lastLaunch=t}
    rockets=rockets.filter(r=>{r.y+=r.vy;r.vy*=.985;
      ctx.fillStyle=r.col;ctx.beginPath();ctx.arc(r.x,r.y,2.5*k,0,7);ctx.fill();
      if(r.y<=r.ty||r.vy>-1){burst(r.x,r.y,r.col);return false}return true});
    sparks=sparks.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06*k;p.vx*=.985;p.vy*=.985;p.life-=.012;
      if(p.life<=0)return false;
      ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,2.2*k,0,7);ctx.fill();ctx.globalAlpha=1;return true});
    if(el<duration||sparks.length||rockets.length){fwRAF=requestAnimationFrame(tick)}
    else{ctx.globalCompositeOperation="source-over";ctx.clearRect(0,0,W(),H())}
  }
  cancelAnimationFrame(fwRAF);ctx.clearRect(0,0,W(),H());fwRAF=requestAnimationFrame(tick);
}

renderCands();renderResults();
</script>
